rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // غيّر البريد التالي إلى بريدك (نفس ADMIN_EMAIL في index.html)
    function admin() { return request.auth.token.email == 'lslammtafa@gmail.com'; }
    function signed() { return request.auth != null; }
    function ok() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.banned != true; }

    match /users/{u} {
      allow read: if signed();
      allow create: if request.auth.uid == u && request.resource.data.premium == false;
      allow update: if (request.auth.uid == u
          && request.resource.data.premium == resource.data.premium
          && request.resource.data.get('banned', false) == resource.data.get('banned', false)) || admin();
      allow delete: if admin();
    }
    match /public/{m} {
      allow read: if signed();
      allow create: if signed() && ok() && request.resource.data.uid == request.auth.uid && request.resource.data.t.size() < 500;
      allow delete: if admin();
    }
    match /payments/{u} {
      allow read: if admin() || request.auth.uid == u;
      allow create: if request.auth.uid == u && request.resource.data.status == 'pending';
      allow update, delete: if admin();
    }
    match /settings/{s} {
      allow read: if true;
      allow write: if admin();
    }
    match /chats/{c}/msgs/{m} {
      allow read: if signed() && request.auth.uid in c.split('_');
      allow create: if signed() && ok() && request.auth.uid in c.split('_')
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.t.size() < 500
        && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.premium == true;
    }
  }
}

window.NO=id=>{if(confirm("رفض الطلب؟"))deleteDoc(doc(db,"payments",id))};
window.OK=async id=>{await updateDoc(doc(db,"users",id),{premium:true});await updateDoc(doc(db,"payments",id),{status:"done"})};

function prof(){const u=me||{name:"",age:"",c:"مصر",g:"m",bio:"",pic:""};
$("#v").innerHTML=`<div class="box"><div style="text-align:center">${u.pic?`<img class="pic" src="${u.pic}" alt="">`:`<div class="pic">📷</div>`}
<label class="btn o sm" style="display:inline-block;margin:10px 0;cursor:pointer">تحميل صورة<input type="file" accept="image/*" class="hide" id="fi"></label></div>
<label>الاسم</label><input id="pn" maxlength="40" value="${esc(u.name)}"><label>العمر</label><input id="pa" type="number" min="18" max="80" value="${esc(u.age)}">
<label>الدولة</label><select id="pc">${C.map(c=>`<option ${c==u.c?"selected":""}>${c}</option>`).join("")}</select>
<label>أنا</label><select id="pg"><option value="m" ${u.g=="m"?"selected":""}>رجل يبحث عن زواج</option><option value="f" ${u.g=="f"?"selected":""}>امرأة تبحث عن زواج</option></select>
<label>نبذة عني</label><textarea id="pb" rows="3" maxlength="300">${esc(u.bio)}</textarea>
<button class="btn" id="sv">حفظ</button><button class="btn o" style="margin-top:8px" id="lo">تسجيل الخروج</button></div>${AD()}`;
let pic=u.pic||"";
$("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=240;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);pic=c.toDataURL("image/jpeg",.7);$(".pic").outerHTML=`<img class="pic" src="${pic}" alt="">`};im.src=r.result};r.readAsDataURL(f)};
$("#lo").onclick=()=>signOut(auth);
$("#sv").onclick=async()=>{const a=+$("#pa").value,n=$("#pn").value.trim();if(!n)return alert("اكتب اسمك");if(!(a>=18))return alert("العمر 18 سنة فأكثر");
const data={name:n,age:a,c:$("#pc").value,g:$("#pg").value,bio:$("#pb").value,pic};
try{if(me)await updateDoc(doc(db,"users",U.uid),data);else await setDoc(doc(db,"users",U.uid),{...data,premium:false,created:serverTimestamp()});
me={...(me||{premium:false}),...data};alert("تم الحفظ ✅");T("home")}catch(e){alert("تعذّر الحفظ: "+(e.code||e.message))}}}
</script>
</body>
</html>
